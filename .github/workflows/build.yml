name: Build Rate Desk

# Builds installers and posts a GitHub release on every push to main.
# Rate publishes (rates/**) never trigger a build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "rates/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: NMC-Rate-Desk-mac
            glob: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: windows-latest
            script: build:win
            artifact: NMC-Rate-Desk-windows
            glob: |
              dist/*.exe
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned, like the toolkit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NMC Rate Desk ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Rate Desk installers built by GitHub Actions from commit ${{ github.sha }} (build ${{ github.run_number }}).
            Installed copies check this page for updates automatically.

            - **Windows:** `NMC-Rate-Desk-Setup-*.exe` — unsigned, so SmartScreen may show "unrecognized app" → More info → Run anyway.
            - **Mac:** `NMC-Rate-Desk-*.dmg` — unsigned, so the first open is right-click → Open.

            First run: Settings → paste the publishing key (a GitHub fine-grained token for this repo, Contents: read and write).
          files: out/**/*
